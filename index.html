<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>D&D VTT & Дневник Кампании</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- MQTT.js для мгновенной синхронизации координат и состояния без настроек -->
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <!-- Gun.js для распределенного хранения состояния -->
  <script src="https://cdn.jsdelivr.net/npm/gun/gun.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: 'Inter', sans-serif; background: #0f1117; color: #e2e8f0; }
    input, textarea { user-select: text; -webkit-user-select: text; }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 9999px; }
    .glass { background: rgba(17, 20, 28, 0.88); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.08); }
    .tool-btn { transition: all 0.15s ease; }
    .tool-btn.active { background: #4f46e5; color: #fff; box-shadow: 0 0 12px rgba(79, 70, 229, 0.5); }
  </style>
</head>
<body class="relative w-screen h-screen overflow-hidden">

  <!-- ================= ИГРОВОЕ ПОЛЕ (CANVAS КАК В OWLBEAR RODEO) ================= -->
  <canvas id="vtt-canvas" class="absolute inset-0 w-full h-full cursor-grab active:cursor-grabbing"></canvas>

  <!-- ================= ВЕРХНЯЯ ПАНЕЛЬ (СТАТУС, ИМЯ, РЕЖИМ ДМ) ================= -->
  <div class="fixed top-3 left-3 right-3 flex items-center justify-between pointer-events-none z-20">
    <!-- Левый блок: Статус общей базы и имя игрока -->
    <div class="glass px-3 py-1.5 rounded-xl flex items-center gap-3 pointer-events-auto shadow-lg">
      <div class="flex items-center gap-2" title="Автоматическая общая синхронизация включена">
        <span id="sync-dot" class="w-2.5 h-2.5 rounded-full bg-amber-400 animate-pulse"></span>
        <span id="sync-text" class="text-xs font-medium text-slate-300">Подключение...</span>
      </div>
      <div class="h-4 w-[1px] bg-slate-700"></div>
      <input id="player-name" type="text" placeholder="Ваше имя" 
        class="bg-slate-800/80 text-xs text-white px-2.5 py-1 rounded-lg border border-slate-700 focus:outline-none focus:border-indigo-500 w-28"
         value="">
      <button id="dm-toggle" onclick="toggleDM()" 
        class="text-xs px-2.5 py-1 rounded-lg border border-slate-700 bg-slate-800/60 text-slate-400 hover:text-white transition">
        👑 Режим ДМ: ВЫКЛ
      </button>
    </div>

    <!-- Правый блок: Кнопки открытия Заметок/Задач и Карты -->
    <div class="glass p-1.5 rounded-xl flex items-center gap-1.5 pointer-events-auto shadow-lg">
      <button onclick="centerCamera()" class="px-2.5 py-1.5 rounded-lg text-xs text-slate-300 hover:bg-slate-800 transition" title="Вернуть камеру в центр">
        🎯 Центр
      </button>
      <button onclick="toggleSidebar('notes')" id="btn-tab-notes" class="px-3 py-1.5 rounded-lg text-xs font-medium bg-indigo-600 text-white transition flex items-center gap-1.5">
        📓 Заметки <span id="notes-count" class="bg-black/30 px-1.5 py-0.2 rounded text-[10px]">0</span>
      </button>
      <button onclick="toggleSidebar('tasks')" id="btn-tab-tasks" class="px-3 py-1.5 rounded-lg text-xs font-medium text-slate-300 hover:bg-slate-800 transition flex items-center gap-1.5">
        ✅ Задачи <span id="tasks-count" class="bg-slate-800 px-1.5 py-0.2 rounded text-[10px]">0</span>
      </button>
    </div>
  </div>

  <!-- ================= НИЖНИЙ ДОК ИНСТРУМЕНТОВ OWLBEAR RODEO ================= -->
  <div class="fixed bottom-4 left-1/2 -translate-x-1/2 glass px-2.5 py-2 rounded-2xl flex items-center gap-1.5 shadow-2xl z-20">
    <button onclick="setTool('move')" id="tool-move" class="tool-btn active px-3 py-2 rounded-xl text-xs font-medium flex items-center gap-1.5" title="Двигать карту и токены (Пробел / ЛКМ)">
      ✋ Рука / Токены
    </button>
    <button onclick="setTool('measure')" id="tool-measure" class="tool-btn px-3 py-2 rounded-xl text-xs font-medium text-slate-300 hover:bg-slate-800 flex items-center gap-1.5" title="Измерить расстояние в футах (5ft клетка)">
      📏 Линейка
    </button>
    <button onclick="setTool('draw')" id="tool-draw" class="tool-btn px-3 py-2 rounded-xl text-xs font-medium text-slate-300 hover:bg-slate-800 flex items-center gap-1.5" title="Рисовать маркером на карте">
      ✏️ Маркер
    </button>
    <button onclick="clearDrawings()" class="px-2 py-2 rounded-xl text-xs text-slate-400 hover:text-rose-400 hover:bg-slate-800" title="Очистить все рисунки">
      🗑️
    </button>

    <div class="h-6 w-[1px] bg-slate-700 mx-1"></div>

    <!-- Добавление токенов -->
    <button onclick="openTokenModal()" class="px-3 py-2 rounded-xl text-xs font-medium bg-emerald-600/20 text-emerald-300 border border-emerald-500/30 hover:bg-emerald-600/30 flex items-center gap-1.5">
      ➕ Токен
    </button>

    <!-- Инструменты ДМа (Туман войны и Смена карты) -->
    <div id="dm-tools" class="hidden items-center gap-1.5 pl-1 border-l border-slate-700">
      <button onclick="setTool('fog')" id="tool-fog" class="tool-btn px-3 py-2 rounded-xl text-xs font-medium text-amber-300 hover:bg-slate-800 flex items-center gap-1.5" title="Кликайте или ведите по клеткам, чтобы скрыть/открыть Туман Войны">
        ☁️ Туман
      </button>
      <button onclick="fillAllFog()" class="px-2.5 py-2 rounded-xl text-xs text-slate-300 hover:bg-slate-800" title="Залить всю карту туманом">
        🌑 Скрыть всё
      </button>
      <button onclick="clearAllFog()" class="px-2.5 py-2 rounded-xl text-xs text-slate-300 hover:bg-slate-800" title="Убрать весь туман">
        ☀️ Открыть
      </button>
      <button onclick="openMapModal()" class="px-3 py-2 rounded-xl text-xs font-medium bg-amber-500/20 text-amber-300 border border-amber-500/30 hover:bg-amber-500/30">
        🗺️ Карта
      </button>
    </div>
  </div>

  <!-- ================= ПАНЕЛЬ КУБИКОВ (СЛЕВА ВНИЗУ) ================= -->
  <div class="fixed bottom-4 left-4 glass p-2 rounded-2xl flex flex-col gap-1.5 z-20 shadow-xl">
    <div id="dice-toast" class="hidden text-xs px-2.5 py-1.5 rounded-lg bg-indigo-950/90 border border-indigo-500/40 text-indigo-200 max-w-[210px] mb-1"></div>
    <div class="flex items-center gap-1">
      <button onclick="rollDice(4)" class="px-2 py-1.5 rounded-lg bg-slate-800 hover:bg-indigo-600 text-xs font-semibold transition">d4</button>
      <button onclick="rollDice(6)" class="px-2 py-1.5 rounded-lg bg-slate-800 hover:bg-indigo-600 text-xs font-semibold transition">d6</button>
      <button onclick="rollDice(8)" class="px-2 py-1.5 rounded-lg bg-slate-800 hover:bg-indigo-600 text-xs font-semibold transition">d8</button>
      <button onclick="rollDice(10)" class="px-2 py-1.5 rounded-lg bg-slate-800 hover:bg-indigo-600 text-xs font-semibold transition">d10</button>
      <button onclick="rollDice(12)" class="px-2 py-1.5 rounded-lg bg-slate-800 hover:bg-indigo-600 text-xs font-semibold transition">d12</button>
      <button onclick="rollDice(20)" class="px-2.5 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold transition">d20</button>
    </div>
  </div>

  <!-- ================= КОНТЕКСТНОЕ МЕНЮ ТОКЕНА (ПРИ КЛИКЕ НА ТОКЕН) ================= -->
  <div id="token-inspector" class="hidden fixed top-16 left-4 glass p-3 rounded-2xl w-64 z-20 shadow-2xl">
    <div class="flex items-center justify-between mb-2">
      <span id="insp-name" class="font-semibold text-sm text-white truncate">Герой</span>
      <button onclick="closeInspector()" class="text-slate-400 hover:text-white text-xs">✕</button>
    </div>
    <div class="flex items-center gap-2 mb-2">
      <label class="text-xs text-slate-400">ХП:</label>
      <input id="insp-hp" type="text" placeholder="25/25" onchange="updateSelectedToken('hp', this.value)"
        class="bg-slate-800 text-xs text-white px-2 py-1 rounded border border-slate-700 w-24">
      <label class="text-xs text-slate-400 ml-1">Размер:</label>
      <select id="insp-size" onchange="updateSelectedToken('size', Number(this.value))"
        class="bg-slate-800 text-xs text-white px-1.5 py-1 rounded border border-slate-700">
        <option value="1">1x1</option>
        <option value="2">2x2</option>
        <option value="3">3x3</option>
      </select>
    </div>
    <div class="flex items-center justify-between pt-2 border-t border-slate-800">
      <button onclick="deleteSelectedToken()" class="text-xs text-rose-400 hover:text-rose-300">🗑️ Удалить с поля</button>
    </div>
  </div>

  <!-- ================= БОКОВАЯ ПАНЕЛЬ: ОБЩИЕ ЗАМЕТКИ И ЗАДАЧИ ================= -->
  <aside id="sidebar" class="fixed top-16 right-3 bottom-20 w-80 sm:w-96 glass rounded-2xl flex flex-col z-20 shadow-2xl transition-transform duration-200">
    <!-- Шапка панели -->
    <div class="p-3.5 border-b border-slate-800 flex items-center justify-between">
      <h2 id="sidebar-title" class="text-sm font-semibold text-white">📓 Общие заметки партии</h2>
      <button onclick="closeSidebar()" class="text-xs text-slate-400 hover:text-white px-2 py-0.5 rounded hover:bg-slate-800">Скрыть ✕</button>
    </div>

    <!-- Вкладка: ЗАМЕТКИ -->
    <div id="panel-notes" class="flex-1 flex flex-col overflow-hidden p-3 gap-3">
      <div class="flex flex-col gap-2 bg-slate-900/70 p-2.5 rounded-xl border border-slate-800">
        <input id="note-title" type="text" placeholder="Заголовок заметки..." 
          class="bg-transparent text-xs font-semibold text-white placeholder-slate-500 focus:outline-none">
        <textarea id="note-body" rows="2" placeholder="Напишите заметку — она сразу появится у всех..." 
          class="bg-transparent text-xs text-slate-300 placeholder-slate-500 focus:outline-none resize-none"></textarea>
        <div class="flex justify-end">
          <button onclick="addNote()" class="px-3 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-medium transition">
            Опубликовать
          </button>
        </div>
      </div>
      <div id="notes-list" class="flex-1 overflow-y-auto space-y-2 pr-1"></div>
    </div>

    <!-- Вкладка: ЗАДАЧИ -->
    <div id="panel-tasks" class="hidden flex-1 flex flex-col overflow-hidden p-3 gap-3">
      <form onsubmit="event.preventDefault(); addTask();" class="flex gap-1.5">
        <input id="task-input" type="text" placeholder="Новая общая задача или квест..." 
          class="flex-1 bg-slate-900/80 text-xs text-white px-3 py-2 rounded-xl border border-slate-800 focus:outline-none focus:border-indigo-500">
        <button type="submit" class="px-3 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-medium">
          +
        </button>
      </form>
      <div id="tasks-list" class="flex-1 overflow-y-auto space-y-1.5 pr-1"></div>
    </div>
  </aside>

  <!-- ================= МОДАЛКА ДОБАВЛЕНИЯ ТОКЕНА ================= -->
  <div id="token-modal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-30 p-4">
    <div class="glass p-5 rounded-2xl w-full max-w-sm shadow-2xl">
      <h3 class="text-sm font-semibold text-white mb-3">Добавить токен на карту</h3>
      <div class="space-y-3">
        <div>
          <label class="text-xs text-slate-400 block mb-1">Имя персонажа / монстра</label>
          <input id="new-token-name" type="text" placeholder="Например: Гоблин или Артур" 
            class="w-full bg-slate-900 text-xs text-white px-3 py-2 rounded-xl border border-slate-700">
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-xs text-slate-400 block mb-1">ХП (опционально)</label>
            <input id="new-token-hp" type="text" placeholder="30/30" 
              class="w-full bg-slate-900 text-xs text-white px-3 py-2 rounded-xl border border-slate-700">
          </div>
          <div>
            <label class="text-xs text-slate-400 block mb-1">Размер (клеток)</label>
            <select id="new-token-size" class="w-full bg-slate-900 text-xs text-white px-3 py-2 rounded-xl border border-slate-700">
              <option value="1">1x1 (Средний)</option>
              <option value="2">2x2 (Большой)</option>
              <option value="3">3x3 (Огромный)</option>
            </select>
          </div>
        </div>
        <div>
          <label class="text-xs text-slate-400 block mb-1">Цвет фишки</label>
          <div class="flex gap-2" id="color-picker">
            <button type="button" onclick="selectTokenColor('#4f46e5')" class="w-7 h-7 rounded-full bg-indigo-600 ring-2 ring-white"></button>
            <button type="button" onclick="selectTokenColor('#10b981')" class="w-7 h-7 rounded-full bg-emerald-500"></button>
            <button type="button" onclick="selectTokenColor('#ef4444')" class="w-7 h-7 rounded-full bg-red-500"></button>
            <button type="button" onclick="selectTokenColor('#f59e0b')" class="w-7 h-7 rounded-full bg-amber-500"></button>
            <button type="button" onclick="selectTokenColor('#ec4899')" class="w-7 h-7 rounded-full bg-pink-500"></button>
            <button type="button" onclick="selectTokenColor('#06b6d4')" class="w-7 h-7 rounded-full bg-cyan-500"></button>
          </div>
        </div>
        <div>
          <label class="text-xs text-slate-400 block mb-1">Или загрузите картинку-аватарку</label>
          <input id="new-token-img" type="file" accept="image/*" class="text-xs text-slate-400 w-full">
        </div>
      </div>
      <div class="flex justify-end gap-2 mt-4">
        <button onclick="closeTokenModal()" class="px-3 py-1.5 rounded-xl text-xs text-slate-400 hover:bg-slate-800">Отмена</button>
        <button onclick="createTokenConfirmed()" class="px-4 py-1.5 rounded-xl text-xs font-medium bg-indigo-600 text-white hover:bg-indigo-500">Создать</button>
      </div>
    </div>
  </div>

  <!-- ================= МОДАЛКА ЗАГРУЗКИ КАРТЫ (ДЛЯ ДМ) ================= -->
  <div id="map-modal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-30 p-4">
    <div class="glass p-5 rounded-2xl w-full max-w-md shadow-2xl">
      <h3 class="text-sm font-semibold text-white mb-3">🗺️ Настройка боевой карты</h3>
      <div class="space-y-3">
        <div>
          <label class="text-xs text-slate-400 block mb-1">Быстрые пресеты фона:</label>
          <div class="grid grid-cols-3 gap-2">
            <button onclick="setPresetMap('dungeon')" class="p-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs text-center">🧱 Подземелье</button>
            <button onclick="setPresetMap('grass')" class="p-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs text-center">🌲 Лесная поляна</button>
            <button onclick="setPresetMap('parchment')" class="p-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs text-center">📜 Пергамент</button>
          </div>
        </div>
        <div>
          <label class="text-xs text-slate-400 block mb-1">Ссылка на картинку карты (URL):</label>
          <input id="map-url-input" type="url" placeholder="https://..." 
            class="w-full bg-slate-900 text-xs text-white px-3 py-2 rounded-xl border border-slate-700">
        </div>
        <div>
          <label class="text-xs text-slate-400 block mb-1">Или загрузить файл карты с ПК (авто-сжатие для сети):</label>
          <input id="map-file-input" type="file" accept="image/*" onchange="uploadMapFile(this)" class="text-xs text-slate-400 w-full">
        </div>
      </div>
      <div class="flex justify-end gap-2 mt-4">
        <button onclick="closeMapModal()" class="px-3 py-1.5 rounded-xl text-xs text-slate-400 hover:bg-slate-800">Закрыть</button>
        <button onclick="applyMapUrl()" class="px-4 py-1.5 rounded-xl text-xs font-medium bg-indigo-600 text-white hover:bg-indigo-500">Применить URL</button>
      </div>
    </div>
  </div>

<script>
/* ============================================================================
   1. АВТОМАТИЧЕСКАЯ БАЗА ДАННЫХ И REALTIME-СИНХРОНИЗАЦИЯ (БЕЗ ССЫЛОК И НАСТРОЕК)
   ============================================================================ */
// Уникальный ключ вашей кампании генерируется автоматически из адреса сайта
const AUTO_ROOM_KEY = 'dnd_vtt_auto_' + (location.hostname + location.pathname).replace(/[^a-zA-Z0-9]/g, '_');
const CLIENT_ID = 'u_' + Math.random().toString(36).slice(2, 9);

// Единое состояние приложения
let state = {
  notes: [],
  tasks: [],
  tokens: [
    { id: 't1', name: 'Воин', x: 4, y: 4, size: 1, color: '#4f46e5', hp: '32/32', img: null },
    { id: 't2', name: 'Маг', x: 5, y: 5, size: 1, color: '#06b6d4', hp: '18/18', img: null },
    { id: 't3', name: 'Босс Огр', x: 9, y: 5, size: 2, color: '#ef4444', hp: '59/59', img: null }
  ],
  fog: {},          // { "x_y": true } — координаты скрытых туманом клеток
  drawings: [],     // Линии маркера
  mapPreset: 'dungeon',
  mapDataUrl: ''
};

// Загружаем локальный кэш мгновенно при старте
try {
  const saved = localStorage.getItem(AUTO_ROOM_KEY);
  if (saved) state = { ...state, ...JSON.parse(saved) };
} catch (e) {}

// Имя игрока
const playerNameInput = document.getElementById('player-name');
playerNameInput.value = localStorage.getItem('dnd_player_name') || ('Игрок ' + Math.floor(Math.random()*90+10));
playerNameInput.addEventListener('input', () => localStorage.setItem('dnd_player_name', playerNameInput.value));

// Подключаем GunDB (распределенная база для сохранения между сессиями)
const gun = Gun(['https://gun-manhattan.herokuapp.com/gun', 'https://peer.wallie.io/gun']);
const gunRoom = gun.get(AUTO_ROOM_KEY);

gunRoom.get('sharedState').on((data) => {
  if (!data || !data.payload || data.sender === CLIENT_ID) return;
  try {
    const incoming = JSON.parse(data.payload);
    mergeIncomingState(incoming);
  } catch (e) {}
});

// Подключаем быстрый WebSocket брокер (MQTT over WSS) для мгновенного передвижения токенов
let mqttClient = null;
const MQTT_TOPIC = 'owlbear_vtt_sync/' + AUTO_ROOM_KEY;

function initRealtimeNetwork() {
  const dot = document.getElementById('sync-dot');
  const txt = document.getElementById('sync-text');

  mqttClient = mqtt.connect('wss://broker.emqx.io:8084/mqtt', {
    clientId: CLIENT_ID,
    clean: true,
    reconnectPeriod: 3000
  });

  mqttClient.on('connect', () => {
    dot.className = 'w-2.5 h-2.5 rounded-full bg-emerald-400';
    txt.textContent = 'Онлайн (Общая база)';
    mqttClient.subscribe(MQTT_TOPIC);
    // Запрашиваем актуальное состояние у тех, кто уже на сайте
    mqttClient.publish(MQTT_TOPIC, JSON.stringify({ type: 'REQ_SYNC', sender: CLIENT_ID }));
  });

  mqttClient.on('message', (topic, message) => {
    try {
      const packet = JSON.parse(message.toString());
      if (packet.sender === CLIENT_ID) return;

      if (packet.type === 'REQ_SYNC') {
        // Отправляем новичку текущее состояние
        broadcastState('FULL_STATE');
      } else if (packet.type === 'FULL_STATE' || packet.type === 'UPDATE') {
        mergeIncomingState(packet.state);
      } else if (packet.type === 'DICE') {
        showDiceToast(packet.text);
      }
    } catch (e) {}
  });

  mqttClient.on('offline', () => {
    dot.className = 'w-2.5 h-2.5 rounded-full bg-amber-400';
    txt.textContent = 'Локальный режим';
  });
}

function broadcastState(type = 'UPDATE') {
  try {
    localStorage.setItem(AUTO_ROOM_KEY, JSON.stringify(state));
  } catch (e) {}

  const payloadStr = JSON.stringify(state);

  // Отправка по быстрому WebSocket
  if (mqttClient && mqttClient.connected) {
    mqttClient.publish(MQTT_TOPIC, JSON.stringify({
      type,
      sender: CLIENT_ID,
      state
    }));
  }

  // Сохранение в облачном графе GunDB
  gunRoom.get('sharedState').put({
    sender: CLIENT_ID,
    payload: payloadStr,
    updatedAt: Date.now()
  });
}

function mergeIncomingState(incoming) {
  if (!incoming) return;
  state = { ...state, ...incoming };
  try { localStorage.setItem(AUTO_ROOM_KEY, JSON.stringify(state)); } catch (e) {}
  if (state.mapDataUrl) loadMapImage(state.mapDataUrl);
  renderNotes();
  renderTasks();
  updateInspectorUI();
}

/* ============================================================================
   2. ДВИЖОК ПОЛЯ OWLBEAR RODEO (CANVAS, КАМЕРА, СЕТКА, ТОКЕНЫ, ТУМАН, ЛИНЕЙКА)
   ============================================================================ */
const canvas = document.getElementById('vtt-canvas');
const ctx = canvas.getContext('2d');

const GRID_SIZE = 56; // 1 клетка = 56px = 5 футов
let cam = { x: 120, y: 80, zoom: 1 };
let currentTool = 'move'; // 'move' | 'measure' | 'draw' | 'fog'
let isDM = false;

let draggingToken = null;
let selectedTokenId = null;
let isPanning = false;
let panStart = { x: 0, y: 0 };
let measureLine = null;
let currentDrawing = null;
let fogPaintingMode = null; // true = ставить туман, false = стирать туман

let bgImage = new Image();
let bgImageLoaded = false;
let tokenImageCache = {};

function loadMapImage(url) {
  if (!url) { bgImageLoaded = false; return; }
  if (bgImage.src === url && bgImageLoaded) return;
  bgImage = new Image();
  bgImage.crossOrigin = 'anonymous';
  bgImage.onload = () => { bgImageLoaded = true; };
  bgImage.src = url;
}

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

function screenToWorld(sx, sy) {
  return {
    x: (sx - cam.x) / cam.zoom,
    y: (sy - cam.y) / cam.zoom
  };
}

function centerCamera() {
  cam = { x: 120, y: 80, zoom: 1 };
}

function setTool(tool) {
  currentTool = tool;
  document.querySelectorAll('.tool-btn').forEach(btn => btn.classList.remove('active'));
  const activeBtn = document.getElementById('tool-' + tool);
  if (activeBtn) activeBtn.classList.add('active');
}

function toggleDM() {
  isDM = !isDM;
  const btn = document.getElementById('dm-toggle');
  const dmTools = document.getElementById('dm-tools');
  if (isDM) {
    btn.textContent = '👑 Режим ДМ: ВКЛ';
    btn.className = 'text-xs px-2.5 py-1 rounded-lg border border-amber-500/50 bg-amber-500/20 text-amber-300 font-semibold transition';
    dmTools.classList.remove('hidden');
    dmTools.classList.add('flex');
  } else {
    btn.textContent = '👑 Режим ДМ: ВЫКЛ';
    btn.className = 'text-xs px-2.5 py-1 rounded-lg border border-slate-700 bg-slate-800/60 text-slate-400 hover:text-white transition';
    dmTools.classList.add('hidden');
    dmTools.classList.remove('flex');
    if (currentTool === 'fog') setTool('move');
  }
}

// Обработка мыши и тач-экрана на Canvas
canvas.addEventListener('mousedown', (e) => {
  if (e.button === 1 || e.button === 2 || e.spaceKey) {
    isPanning = true;
    panStart = { x: e.clientX - cam.x, y: e.clientY - cam.y };
    return;
  }

  const world = screenToWorld(e.clientX, e.clientY);
  const gx = Math.floor(world.x / GRID_SIZE);
  const gy = Math.floor(world.y / GRID_SIZE);

  if (currentTool === 'move') {
    // Проверяем, кликнули ли по токену
    const hit = findTokenAt(world.x, world.y);
    if (hit) {
      draggingToken = hit;
      selectedTokenId = hit.id;
      updateInspectorUI();
    } else {
      selectedTokenId = null;
      closeInspector();
      isPanning = true;
      panStart = { x: e.clientX - cam.x, y: e.clientY - cam.y };
    }
  } else if (currentTool === 'measure') {
    measureLine = { x1: world.x, y1: world.y, x2: world.x, y2: world.y };
  } else if (currentTool === 'draw') {
    currentDrawing = { color: '#f43f5e', points: [{ x: world.x, y: world.y }] };
    state.drawings.push(currentDrawing);
  } else if (currentTool === 'fog' && isDM) {
    const key = `${gx}_${gy}`;
    fogPaintingMode = !state.fog[key];
    if (fogPaintingMode) state.fog[key] = true;
    else delete state.fog[key];
    broadcastState();
  }
});

window.addEventListener('mousemove', (e) => {
  const world = screenToWorld(e.clientX, e.clientY);

  if (isPanning) {
    cam.x = e.clientX - panStart.x;
    cam.y = e.clientY - panStart.y;
    return;
  }

  if (draggingToken && currentTool === 'move') {
    // Плавное перетаскивание с привязкой к сетке при отпускании
    draggingToken._dragX = world.x - (draggingToken.size * GRID_SIZE) / 2;
    draggingToken._dragY = world.y - (draggingToken.size * GRID_SIZE) / 2;
  } else if (measureLine && currentTool === 'measure') {
    measureLine.x2 = world.x;
    measureLine.y2 = world.y;
  } else if (currentDrawing && currentTool === 'draw') {
    currentDrawing.points.push({ x: world.x, y: world.y });
  } else if (fogPaintingMode !== null && currentTool === 'fog' && isDM) {
    const gx = Math.floor(world.x / GRID_SIZE);
    const gy = Math.floor(world.y / GRID_SIZE);
    const key = `${gx}_${gy}`;
    if (fogPaintingMode) state.fog[key] = true;
    else delete state.fog[key];
  }
});

window.addEventListener('mouseup', () => {
  if (draggingToken) {
    if (draggingToken._dragX !== undefined) {
      // Привязка к клеткам сетки (Grid Snapping как в Owlbear Rodeo)
      draggingToken.x = Math.round(draggingToken._dragX / GRID_SIZE);
      draggingToken.y = Math.round(draggingToken._dragY / GRID_SIZE);
      delete draggingToken._dragX;
      delete draggingToken._dragY;
      broadcastState();
    }
    draggingToken = null;
  }
  if (currentDrawing) {
    currentDrawing = null;
    broadcastState();
  }
  if (fogPaintingMode !== null) {
    fogPaintingMode = null;
    broadcastState();
  }
  isPanning = false;
  measureLine = null;
});

// Зум колёсиком мыши относительно курсора
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  const zoomFactor = e.deltaY < 0 ? 1.12 : 0.89;
  const newZoom = Math.min(Math.max(cam.zoom * zoomFactor, 0.35), 3.0);

  const wx = (e.clientX - cam.x) / cam.zoom;
  const wy = (e.clientY - cam.y) / cam.zoom;

  cam.zoom = newZoom;
  cam.x = e.clientX - wx * cam.zoom;
  cam.y = e.clientY - wy * cam.zoom;
}, { passive: false });

function findTokenAt(wx, wy) {
  for (let i = state.tokens.length - 1; i >= 0; i--) {
    const t = state.tokens[i];
    const tx = t.x * GRID_SIZE;
    const ty = t.y * GRID_SIZE;
    const sizePx = (t.size || 1) * GRID_SIZE;
    if (wx >= tx && wx <= tx + sizePx && wy >= ty && wy <= ty + sizePx) {
      return t;
    }
  }
  return null;
}

// Основной цикл рендеринга (60 FPS)
function renderLoop() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.save();
  ctx.translate(cam.x, cam.y);
  ctx.scale(cam.zoom, cam.zoom);

  // 1. Отрисовка подложки боевых клеток (24x16 клеток по умолчанию)
  const COLS = 26, ROWS = 18;
  const boardW = COLS * GRID_SIZE;
  const boardH = ROWS * GRID_SIZE;

  // Фон карты (Пресет или загруженная картинка)
  if (bgImageLoaded && state.mapDataUrl) {
    ctx.drawImage(bgImage, 0, 0, boardW, boardH);
  } else {
    if (state.mapPreset === 'grass') ctx.fillStyle = '#14261c';
    else if (state.mapPreset === 'parchment') ctx.fillStyle = '#2b251d';
    else ctx.fillStyle = '#161922';
    ctx.fillRect(0, 0, boardW, boardH);
  }

  // 2. Сетка (Grid)
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.09)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = 0; x <= COLS; x++) {
    ctx.moveTo(x * GRID_SIZE, 0);
    ctx.lineTo(x * GRID_SIZE, boardH);
  }
  for (let y = 0; y <= ROWS; y++) {
    ctx.moveTo(0, y * GRID_SIZE);
    ctx.lineTo(boardW, y * GRID_SIZE);
  }
  ctx.stroke();

  // 3. Рисунки маркером
  for (const d of state.drawings) {
    if (!d.points || d.points.length < 2) continue;
    ctx.strokeStyle = d.color || '#f43f5e';
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(d.points[0].x, d.points[0].y);
    for (let i = 1; i < d.points.length; i++) ctx.lineTo(d.points[i].x, d.points[i].y);
    ctx.stroke();
  }

  // 4. Токены персонажей и монстров
  for (const t of state.tokens) {
    const gx = Math.round((t._dragX !== undefined ? t._dragX : t.x * GRID_SIZE) / GRID_SIZE);
    const gy = Math.round((t._dragY !== undefined ? t._dragY : t.y * GRID_SIZE) / GRID_SIZE);

    // Если токен в тумане войны и мы НЕ ДМ — скрываем его от игроков
    if (!isDM && state.fog[`${gx}_${gy}`]) continue;

    const px = t._dragX !== undefined ? t._dragX : t.x * GRID_SIZE;
    const py = t._dragY !== undefined ? t._dragY : t.y * GRID_SIZE;
    const sz = (t.size || 1) * GRID_SIZE;
    const cx = px + sz / 2;
    const cy = py + sz / 2;
    const radius = sz / 2 - 4;

    // Подсветка выбранного токена
    if (t.id === selectedTokenId) {
      ctx.save();
      ctx.strokeStyle = '#818cf8';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(cx, cy, radius + 4, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    // Кружок токена
    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, Math.PI * 2);
    ctx.closePath();
    ctx.clip();

    if (t.img) {
      if (!tokenImageCache[t.img]) {
        const im = new Image();
        im.src = t.img;
        tokenImageCache[t.img] = im;
      }
      const im = tokenImageCache[t.img];
      if (im.complete) ctx.drawImage(im, px + 4, py + 4, sz - 8, sz - 8);
    } else {
      ctx.fillStyle = t.color || '#4f46e5';
      ctx.fillRect(px, py, sz, sz);
      ctx.fillStyle = '#ffffff';
      ctx.font = `bold ${Math.round(14 * (t.size || 1))}px Inter`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText((t.name || '?').slice(0, 2).toUpperCase(), cx, cy);
    }
    ctx.restore();

    // Ободок токена
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, Math.PI * 2);
    ctx.stroke();

    // Плашка с именем и ХП
    ctx.font = '600 11px Inter';
    ctx.textAlign = 'center';
    const label = t.hp ? `${t.name} (${t.hp})` : t.name;
    const textW = ctx.measureText(label).width + 10;
    ctx.fillStyle = 'rgba(15, 17, 23, 0.85)';
    ctx.fillRect(cx - textW / 2, py + sz - 4, textW, 18);
    ctx.fillStyle = '#f8fafc';
    ctx.fillText(label, cx, py + sz + 8);
  }

  // 5. Туман войны (Fog of War)
  for (const key in state.fog) {
    if (!state.fog[key]) continue;
    const [fx, fy] = key.split('_').map(Number);
    // У ДМа туман полупрозрачный, у игроков — полностью непроглядный
    ctx.fillStyle = isDM ? 'rgba(9, 10, 15, 0.62)' : '#07080c';
    ctx.fillRect(fx * GRID_SIZE, fy * GRID_SIZE, GRID_SIZE + 0.5, GRID_SIZE + 0.5);
  }

  // 6. Линейка расстояний (5 футов на клетку)
  if (measureLine) {
    ctx.strokeStyle = '#38bdf8';
    ctx.lineWidth = 3;
    ctx.setLineDash([6, 4]);
    ctx.beginPath();
    ctx.moveTo(measureLine.x1, measureLine.y1);
    ctx.lineTo(measureLine.x2, measureLine.y2);
    ctx.stroke();
    ctx.setLineDash([]);

    const dx = (measureLine.x2 - measureLine.x1) / GRID_SIZE;
    const dy = (measureLine.y2 - measureLine.y1) / GRID_SIZE;
    // Подсчет по правилам D&D 5e (максимум по осям * 5 футов)
    const cells = Math.round(Math.hypot(dx, dy));
    const feet = cells * 5;

    ctx.fillStyle = '#0284c7';
    ctx.fillRect(measureLine.x2 + 8, measureLine.y2 - 14, 70, 22);
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 12px Inter';
    ctx.textAlign = 'center';
    ctx.fillText(`${feet} фт.`, measureLine.x2 + 43, measureLine.y2 + 1);
  }

  ctx.restore();
  requestAnimationFrame(renderLoop);
}

/* ============================================================================
   3. УПРАВЛЕНИЕ ТОКЕНАМИ, ТУМАНОМ И КАРТОЙ
   ============================================================================ */
let newTokenColor = '#4f46e5';

function selectTokenColor(c) {
  newTokenColor = c;
}

function openTokenModal() {
  document.getElementById('token-modal').classList.remove('hidden');
}
function closeTokenModal() {
  document.getElementById('token-modal').classList.add('hidden');
}

function createTokenConfirmed() {
  const name = document.getElementById('new-token-name').value.trim() || 'Герой';
  const hp = document.getElementById('new-token-hp').value.trim();
  const size = Number(document.getElementById('new-token-size').value) || 1;
  const fileInput = document.getElementById('new-token-img');

  const finishCreate = (imgData) => {
    state.tokens.push({
      id: 'tok_' + Date.now(),
      name,
      hp,
      size,
      color: newTokenColor,
      img: imgData || null,
      x: 6 + Math.floor(Math.random() * 4),
      y: 5 + Math.floor(Math.random() * 4)
    });
    broadcastState();
    closeTokenModal();
    document.getElementById('new-token-name').value = '';
    document.getElementById('new-token-hp').value = '';
    fileInput.value = '';
  };

  if (fileInput.files && fileInput.files[0]) {
    compressImageFile(fileInput.files[0], 160, finishCreate);
  } else {
    finishCreate(null);
  }
}

function updateInspectorUI() {
  const insp = document.getElementById('token-inspector');
  const tok = state.tokens.find(t => t.id === selectedTokenId);
  if (!tok) { insp.classList.add('hidden'); return; }
  insp.classList.remove('hidden');
  document.getElementById('insp-name').textContent = tok.name;
  document.getElementById('insp-hp').value = tok.hp || '';
  document.getElementById('insp-size').value = tok.size || 1;
}

function closeInspector() {
  selectedTokenId = null;
  document.getElementById('token-inspector').classList.add('hidden');
}

function updateSelectedToken(field, value) {
  const tok = state.tokens.find(t => t.id === selectedTokenId);
  if (!tok) return;
  tok[field] = value;
  broadcastState();
}

function deleteSelectedToken() {
  state.tokens = state.tokens.filter(t => t.id !== selectedTokenId);
  closeInspector();
  broadcastState();
}

function clearDrawings() {
  state.drawings = [];
  broadcastState();
}

function fillAllFog() {
  for (let x = 0; x < 26; x++) {
    for (let y = 0; y < 18; y++) state.fog[`${x}_${y}`] = true;
  }
  broadcastState();
}

function clearAllFog() {
  state.fog = {};
  broadcastState();
}

function openMapModal() { document.getElementById('map-modal').classList.remove('hidden'); }
function closeMapModal() { document.getElementById('map-modal').classList.add('hidden'); }

function setPresetMap(preset) {
  state.mapPreset = preset;
  state.mapDataUrl = '';
  bgImageLoaded = false;
  broadcastState();
  closeMapModal();
}

function applyMapUrl() {
  const url = document.getElementById('map-url-input').value.trim();
  if (url) {
    state.mapDataUrl = url;
    loadMapImage(url);
    broadcastState();
  }
  closeMapModal();
}

function uploadMapFile(input) {
  if (!input.files || !input.files[0]) return;
  compressImageFile(input.files[0], 1100, (dataUrl) => {
    state.mapDataUrl = dataUrl;
    loadMapImage(dataUrl);
    broadcastState();
    closeMapModal();
  });
}

// Сжатие изображений через Canvas, чтобы они легко передавались всем игрокам
function compressImageFile(file, maxDim, callback) {
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * scale);
      c.height = Math.round(img.height * scale);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      callback(c.toDataURL('image/jpeg', 0.72));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

/* ============================================================================
   4. ОБЩИЕ ЗАМЕТКИ, ЗАДАЧИ И КУБИКИ
   ============================================================================ */
function toggleSidebar(tab) {
  const sb = document.getElementById('sidebar');
  sb.classList.remove('translate-x-[120%]');
  const notesPanel = document.getElementById('panel-notes');
  const tasksPanel = document.getElementById('panel-tasks');
  const btnNotes = document.getElementById('btn-tab-notes');
  const btnTasks = document.getElementById('btn-tab-tasks');

  if (tab === 'notes') {
    document.getElementById('sidebar-title').textContent = '📓 Общие заметки партии';
    notesPanel.classList.remove('hidden');
    tasksPanel.classList.add('hidden');
    btnNotes.className = 'px-3 py-1.5 rounded-lg text-xs font-medium bg-indigo-600 text-white transition flex items-center gap-1.5';
    btnTasks.className = 'px-3 py-1.5 rounded-lg text-xs font-medium text-slate-300 hover:bg-slate-800 transition flex items-center gap-1.5';
  } else {
    document.getElementById('sidebar-title').textContent = '✅ Общие задачи и квесты';
    notesPanel.classList.add('hidden');
    tasksPanel.classList.remove('hidden');
    btnTasks.className = 'px-3 py-1.5 rounded-lg text-xs font-medium bg-indigo-600 text-white transition flex items-center gap-1.5';
    btnNotes.className = 'px-3 py-1.5 rounded-lg text-xs font-medium text-slate-300 hover:bg-slate-800 transition flex items-center gap-1.5';
  }
}

function closeSidebar() {
  document.getElementById('sidebar').classList.add('translate-x-[120%]');
}

function addNote() {
  const titleEl = document.getElementById('note-title');
  const bodyEl = document.getElementById('note-body');
  const title = titleEl.value.trim();
  const body = bodyEl.value.trim();
  if (!title && !body) return;

  state.notes.unshift({
    id: 'n_' + Date.now(),
    title: title || 'Без названия',
    body,
    author: playerNameInput.value || 'Игрок',
    time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
  });

  titleEl.value = '';
  bodyEl.value = '';
  renderNotes();
  broadcastState();
}

function deleteNote(id) {
  state.notes = state.notes.filter(n => n.id !== id);
  renderNotes();
  broadcastState();
}

function renderNotes() {
  const list = document.getElementById('notes-list');
  document.getElementById('notes-count').textContent = state.notes.length;
  if (!state.notes.length) {
    list.innerHTML = `<div class="text-xs text-slate-500 text-center py-8">Пока нет заметок. Добавьте первую!</div>`;
    return;
  }
  list.innerHTML = state.notes.map(n => `
    <div class="p-3 rounded-xl bg-slate-900/75 border border-slate-800/90 group">
      <div class="flex items-start justify-between gap-2">
        <h4 class="text-xs font-semibold text-white">${escapeHtml(n.title)}</h4>
        <button onclick="deleteNote('${n.id}')" class="opacity-0 group-hover:opacity-100 text-[11px] text-slate-500 hover:text-rose-400">✕</button>
      </div>
      <p class="text-xs text-slate-300 mt-1 whitespace-pre-wrap leading-relaxed">${escapeHtml(n.body)}</p>
      <div class="text-[10px] text-slate-500 mt-2 flex justify-between">
        <span>✍️ ${escapeHtml(n.author)}</span>
        <span>${n.time || ''}</span>
      </div>
    </div>
  `).join('');
}

function addTask() {
  const input = document.getElementById('task-input');
  const text = input.value.trim();
  if (!text) return;
  state.tasks.unshift({
    id: 'tsk_' + Date.now(),
    text,
    done: false,
    author: playerNameInput.value || 'Игрок'
  });
  input.value = '';
  renderTasks();
  broadcastState();
}

function toggleTask(id) {
  const t = state.tasks.find(x => x.id === id);
  if (t) t.done = !t.done;
  renderTasks();
  broadcastState();
}

function deleteTask(id) {
  state.tasks = state.tasks.filter(x => x.id !== id);
  renderTasks();
  broadcastState();
}

function renderTasks() {
  const list = document.getElementById('tasks-list');
  document.getElementById('tasks-count').textContent = state.tasks.filter(t => !t.done).length;
  if (!state.tasks.length) {
    list.innerHTML = `<div class="text-xs text-slate-500 text-center py-8">Список задач пуст</div>`;
    return;
  }
  list.innerHTML = state.tasks.map(t => `
    <div class="flex items-center justify-between gap-2 p-2.5 rounded-xl bg-slate-900/75 border border-slate-800/90 group">
      <label class="flex items-center gap-2.5 flex-1 cursor-pointer">
        <input type="checkbox" ${t.done ? 'checked' : ''} onchange="toggleTask('${t.id}')" 
          class="rounded border-slate-700 text-indigo-600 focus:ring-0">
        <span class="text-xs ${t.done ? 'line-through text-slate-500' : 'text-slate-200'}">${escapeHtml(t.text)}</span>
      </label>
      <button onclick="deleteTask('${t.id}')" class="opacity-0 group-hover:opacity-100 text-xs text-slate-500 hover:text-rose-400">✕</button>
    </div>
  `).join('');
}

function rollDice(sides) {
  const val = Math.floor(Math.random() * sides) + 1;
  const who = playerNameInput.value || 'Игрок';
  const msg = `🎲 ${who} бросил d${sides}: выпало ${val}!`;
  showDiceToast(msg);
  if (mqttClient && mqttClient.connected) {
    mqttClient.publish(MQTT_TOPIC, JSON.stringify({ type: 'DICE', sender: CLIENT_ID, text: msg }));
  }
}

let diceTimer = null;
function showDiceToast(text) {
  const el = document.getElementById('dice-toast');
  el.textContent = text;
  el.classList.remove('hidden');
  clearTimeout(diceTimer);
  diceTimer = setTimeout(() => el.classList.add('hidden'), 4500);
}

function escapeHtml(str) {
  return String(str || '').replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
}

// Старт всего приложения
if (state.mapDataUrl) loadMapImage(state.mapDataUrl);
renderNotes();
renderTasks();
initRealtimeNetwork();
requestAnimationFrame(renderLoop);
